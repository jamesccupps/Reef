name: tests

# The gate from CLAUDE.md: the headless core, the browser-layer smoke test, the
# UI hardening checks, the dev-server lockdown and the 3-D lakes' own gate (test/w3.mjs).
# No dependencies to install.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # ~18 min on the dev PC; a shared runner is ~2.5x slower.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      # The speed check's budget is 60 steps/s on a dev PC. GitHub's shared runners measured
      # 55, so CI judges it at 30, the real-time minimum, and stays green on a slow runner.
      # The 3-D gate's timing budgets are the dev PC's (W3_PERF_MUL 1); CI scales them by 3 for
      # the same reason. The strict verdict on speed stays the dev PC's.
      - run: npm test
        env:
          REEF_PERF_MIN: 30
          W3_PERF_MUL: 3
